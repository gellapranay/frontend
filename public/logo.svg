<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="lmiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield/Hexagon -->
  <polygon points="50,6 90,28 90,72 50,94 10,72 10,28" stroke="url(#lmiGrad)" stroke-width="3" fill="#111C2F" fill-opacity="0.8" />
  
  <!-- Facility Gate line -->
  <path d="M 24 64 L 38 48 L 50 60 L 68 34" stroke="url(#lmiGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Nodes along the path -->
  <circle cx="24" cy="64" r="4.5" fill="#67E8F9" />
  <circle cx="38" cy="48" r="3.5" fill="#3B82F6" />
  <circle cx="50" cy="60" r="3.5" fill="#3B82F6" />
  
  <!-- Exact Destination Pin at end -->
  <g transform="translate(68, 34)">
    <circle cx="0" cy="0" r="6" fill="#67E8F9" filter="url(#glow)" />
    <circle cx="0" cy="0" r="2.5" fill="#0B1220" />
    <circle cx="0" cy="0" r="10" stroke="#67E8F9" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
